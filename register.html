<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - Campus Diary</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Site Navbar -->
    <nav class="site-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="navbar-brand-logo">
                <i class="fas fa-book-bookmark text-primary"></i> Campus Diary
            </a>

            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About System</a>
                <a href="features.html" class="nav-link">Features</a>
                <a href="login.html" class="btn btn-outline-primary btn-sm px-3 ms-1">Login</a>
                <a href="register.html" class="btn btn-primary btn-sm px-3 active">Register</a>
            </div>
        </div>
    </nav>

    <!-- Registration Container -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="display-6 mb-1">👤</div>
                <h3 class="fw-bold text-primary mb-1">Create Account</h3>
                <p class="text-muted small">Register for the Smart Campus System</p>
            </div>

            <form onsubmit="app.handleRegisterSubmit(event)">
                <div class="mb-3">
                    <label class="form-label small fw-bold">FULL NAME</label>
                    <input type="text" id="regName" class="form-control" placeholder="e.g. Alex Morgan" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">EMAIL ADDRESS</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="alex@college.edu" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-bold">ROLE</label>
                        <select id="regRole" class="form-select">
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold">DEPARTMENT</label>
                        <input type="text" id="regDept" class="form-control" placeholder="Computer Science" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold">CREATE PASSWORD</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold mb-3">
                    <i class="fas fa-user-plus me-2"></i> Register Account
                </button>
            </form>

            <div class="text-center pt-3 border-top">
                <p class="small text-muted mb-0">Already registered? <a href="login.html" class="fw-bold text-primary text-decoration-none">Sign In here</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
