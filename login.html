<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Campus Diary</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Site Navbar -->
    <nav class="site-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="navbar-brand-logo">
                <i class="fas fa-book-bookmark text-primary"></i> Campus Diary
            </a>

            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About System</a>
                <a href="features.html" class="nav-link">Features</a>
                <a href="login.html" class="btn btn-outline-primary btn-sm px-3 ms-1 active">Login</a>
                <a href="register.html" class="btn btn-primary btn-sm px-3">Register</a>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="display-6 mb-1">📖</div>
                <h3 class="fw-bold text-primary mb-1">Welcome Back</h3>
                <p class="text-muted small">Sign in to access your role dashboard</p>
            </div>

            <!-- Role Selector Pills -->
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">SELECT YOUR ROLE</label>
                <div class="row g-2">
                    <div class="col-4">
                        <div class="role-pill active" data-role="student" onclick="app.setAuthRole('student')">
                            <i class="fas fa-user-graduate d-block mb-1 fs-5"></i>
                            <span class="small">Student</span>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="role-pill" data-role="teacher" onclick="app.setAuthRole('teacher')">
                            <i class="fas fa-chalkboard-teacher d-block mb-1 fs-5"></i>
                            <span class="small">Teacher</span>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="role-pill" data-role="admin" onclick="app.setAuthRole('admin')">
                            <i class="fas fa-user-shield d-block mb-1 fs-5"></i>
                            <span class="small">Admin</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sign In Form -->
            <form id="loginForm" onsubmit="app.handleLoginSubmit(event)">
                <input type="hidden" id="selectedAuthRole" value="student">

                <div class="mb-3">
                    <label class="form-label small fw-bold">EMAIL ADDRESS</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                        <input type="email" id="loginEmail" class="form-control" placeholder="student@demo.com" required value="student@demo.com">
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label small fw-bold mb-0">PASSWORD</label>
                        <a href="forgot-password.html" class="small text-primary text-decoration-none">Forgot Password?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required value="password123">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold mb-3">
                    <i class="fas fa-sign-in-alt me-2"></i> Sign In to Dashboard
                </button>
            </form>

            <div class="text-center pt-3 border-top">
                <p class="small text-muted mb-0">Don't have an account? <a href="register.html" class="fw-bold text-primary text-decoration-none">Register here</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
