<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Recovery - Campus Diary</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Site Navbar -->
    <nav class="site-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="navbar-brand-logo">
                <i class="fas fa-book-bookmark text-primary"></i> Campus Diary
            </a>

            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About System</a>
                <a href="features.html" class="nav-link">Features</a>
                <a href="login.html" class="btn btn-outline-primary btn-sm px-3 ms-1">Login</a>
                <a href="register.html" class="btn btn-primary btn-sm px-3">Register</a>
            </div>
        </div>
    </nav>

    <!-- Forgot Password Container -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="display-6 mb-1">🔑</div>
                <h3 class="fw-bold text-primary mb-1">Reset Password</h3>
                <p class="text-muted small">Enter your registered email address to receive reset instructions</p>
            </div>

            <form onsubmit="app.handleForgotSubmit(event)">
                <div class="mb-4">
                    <label class="form-label small fw-bold">REGISTERED EMAIL ADDRESS</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                        <input type="email" id="forgotEmail" class="form-control" placeholder="student@demo.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold mb-3">
                    <i class="fas fa-paper-plane me-2"></i> Send Password Reset Link
                </button>
            </form>

            <div class="text-center pt-3 border-top">
                <a href="login.html" class="small fw-bold text-primary text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
